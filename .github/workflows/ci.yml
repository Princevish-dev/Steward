name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
      SESSION_SECRET: ci-session-secret
      PAYPAL_ENVIRONMENT: SANDBOX
      USE_LLM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        if: ${{ env.HAS_DATABASE == 'true' }}
        run: npm run e2e
      - name: Report skipped E2E
        if: ${{ env.HAS_DATABASE != 'true' }}
        run: echo "::warning::Playwright E2E skipped because DATABASE_URL is not configured in repository secrets."
